<title>MangaForEver</title>
<meta name="description" content="Discover, track and review manga, manhwa and manhua.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:ital,wght@0,400..800;1,400..600&family=Dela+Gothic+One&family=Black+Han+Sans&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: sticky header over a dark "ink" page; content in a 1240px column; shelves of 2:3 covers.
   Colour comes from the content itself: manga violet, manhwa cyan, manhua coral; genres own their hues. */
:root {
  color-scheme: dark;
  --ink: #0b0918;
  --surface: #141127;
  --raised: #1d1937;
  --line: #2a2550;
  --line-strong: #3d3672;
  --text: #f1eeff;
  --muted: #a5a0c8;
  --faint: #7a759f;
  --violet: #a78bfa;
  --pink: #f472b6;
  --amber: #fbbf24;
  --cyan: #22d3ee;
  --coral: #fb7185;
  --green: #34d399;
  --manga: #a78bfa;
  --manhwa: #22d3ee;
  --manhua: #fb7185;
  --star: #fbbf24;
  --brand: linear-gradient(100deg, #8b5cf6 0%, #ec4899 55%, #f59e0b 100%);
  --on-brand: #ffffff;
  --header-bg: rgba(11, 9, 24, .78);
  --shadow: 0 14px 34px -16px rgba(0, 0, 0, .7);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ink: #f6f4fd; --surface: #ffffff; --raised: #eeeafa; --line: #e0daf2; --line-strong: #c9c0ea;
    --text: #17132e; --muted: #5b567e; --faint: #87829f;
    --violet: #7c3aed; --pink: #db2777; --amber: #b45309; --cyan: #0e7490; --coral: #e11d48; --green: #047857;
    --manga: #7c3aed; --manhwa: #0e7490; --manhua: #e11d48; --star: #d97706;
    --header-bg: rgba(246, 244, 253, .82);
    --shadow: 0 14px 34px -18px rgba(48, 24, 110, .3);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: #f6f4fd; --surface: #ffffff; --raised: #eeeafa; --line: #e0daf2; --line-strong: #c9c0ea;
  --text: #17132e; --muted: #5b567e; --faint: #87829f;
  --violet: #7c3aed; --pink: #db2777; --amber: #b45309; --cyan: #0e7490; --coral: #e11d48; --green: #047857;
  --manga: #7c3aed; --manhwa: #0e7490; --manhua: #e11d48; --star: #d97706;
  --header-bg: rgba(246, 244, 253, .82);
  --shadow: 0 14px 34px -18px rgba(48, 24, 110, .3);
}

* { box-sizing: border-box; }
html { overflow-x: clip; scroll-padding-top: 90px; }
body {
  margin: 0; background: var(--ink); color: var(--text); overflow-x: clip;
  font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.02em; }
p { margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.text-brand { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── Header ─────────────────────────────── */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--header-bg); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.hdr-in { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 21px/1 var(--font-display); letter-spacing: -.03em; flex-shrink: 0; }
.logo-mark { width: 30px; height: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; transform: rotate(-6deg); }
.logo-mark i { border-radius: 4px; }
.logo-mark i:nth-child(1) { background: #8b5cf6; } .logo-mark i:nth-child(2) { background: #06b6d4; border-radius: 4px 12px 4px 4px; }
.logo-mark i:nth-child(3) { background: #f43f5e; } .logo-mark i:nth-child(4) { background: #f59e0b; }
.nav { display: flex; gap: 2px; }
.nav a { padding: 8px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 550; font-size: 14.5px; white-space: nowrap; }
.nav a:hover { color: var(--text); background: var(--raised); }
.nav a[aria-current="page"] { color: var(--text); background: var(--raised); }
.nav a .count { margin-left: 6px; font-size: 11.5px; padding: 1px 6px; border-radius: 99px; background: var(--brand); color: var(--on-brand); font-weight: 700; }
.hdr-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { position: relative; width: min(340px, 34vw); }
.search input { width: 100%; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 34px 0 38px; outline: none; }
.search input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in oklab, var(--violet) 25%, transparent); }
.search svg { position: absolute; left: 12px; top: 11px; color: var(--faint); pointer-events: none; }
.search kbd { position: absolute; right: 10px; top: 10px; font: 600 11px/1 var(--font-body); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.suggest { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 50; }
.suggest a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; text-decoration: none; }
.suggest a[data-active="true"], .suggest a:hover { background: var(--raised); }
.suggest .cover { width: 30px; flex-shrink: 0; border-radius: 5px; }
.suggest .s-t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.suggest .s-m { font-size: 12px; color: var(--muted); }
.suggest .all { justify-content: center; font-size: 13px; color: var(--violet); font-weight: 600; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--text); border-color: var(--line-strong); }
.subnav { display: none; }
@media (max-width: 900px) {
  .hdr .nav:not(.subnav) { display: none; }
  .subnav { display: flex; overflow-x: auto; gap: 4px; padding-block: 0 10px; scrollbar-width: none; }
  .subnav::-webkit-scrollbar { display: none; }
  .search { width: auto; flex: 1; min-width: 0; }
  .search kbd { display: none; }
  .hdr-in { gap: 12px; }
  .hdr-tools { flex: 1; min-width: 0; }
}
@media (max-width: 520px) { .logo span.word { display: none; } }

/* ── Buttons & chips ─────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 13px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 650; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .15s, box-shadow .2s, border-color .2s; }
.btn:hover { border-color: var(--violet); }
.btn:active { transform: translateY(1px); }
.btn-brand { background: var(--brand); color: var(--on-brand); border: 0; box-shadow: 0 10px 26px -12px #ec4899; }
.btn-brand:hover { box-shadow: 0 14px 30px -10px #ec4899; }
.btn-sm { height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; }
.btn[aria-pressed="true"] { border-color: var(--pink); color: var(--pink); background: color-mix(in oklab, var(--pink) 12%, var(--surface)); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 550; cursor: pointer; white-space: nowrap; color: var(--text); text-decoration: none; }
.chip:hover { border-color: var(--line-strong); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--violet)); }
.chip .n { color: var(--faint); font-size: 11.5px; }
.chip[aria-pressed="true"] { background: color-mix(in oklab, var(--c, var(--violet)) 20%, transparent); border-color: color-mix(in oklab, var(--c, var(--violet)) 70%, transparent); }
.chip-static { cursor: default; }
.tt { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; color: var(--c); background: color-mix(in oklab, var(--c) 15%, transparent); border: 1px solid color-mix(in oklab, var(--c) 35%, transparent); white-space: nowrap; }
.tt-MANGA { --c: var(--manga); } .tt-MANHWA { --c: var(--manhwa); } .tt-MANHUA { --c: var(--manhua); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ongoing { color: var(--green); border-color: color-mix(in oklab, var(--green) 45%, transparent); }
.score { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score svg { color: var(--star); }
.score small { font-weight: 500; color: var(--faint); font-size: 11px; }

/* ── Covers (generated, coloured by genre) ── */
.cover { position: relative; isolation: isolate; container-type: inline-size; aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 12px; overflow: hidden; color: #fff; }
.cover::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 6%; background: linear-gradient(90deg, rgba(0,0,0,.4), rgba(255,255,255,.08) 70%, transparent); z-index: 3; }
.cover-tone { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.3) 1px, transparent 1.5px); background-size: 5px 5px; -webkit-mask-image: linear-gradient(to top, #000 5%, transparent 62%); mask-image: linear-gradient(to top, #000 5%, transparent 62%); opacity: .55; }
.cover-native { position: absolute; top: 7%; right: 8%; writing-mode: vertical-rl; font-size: var(--nfs, 13cqw); line-height: 1.04; max-height: 60%; max-width: 62%; overflow: hidden; text-shadow: 0 2px 10px rgba(0,0,0,.35); letter-spacing: .03em; z-index: 1; }
.n-MANGA { font-family: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; }
.n-MANHWA { font-family: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif; }
.n-MANHUA { font-family: "Ma Shan Zheng", "PingFang SC", "Microsoft YaHei", "Noto Serif CJK SC", serif; font-size: calc(var(--nfs, 13cqw) * 1.08); }
.cover-foot { position: absolute; inset: auto 0 0 0; padding: 30cqw 8cqw 8cqw 10cqw; background: linear-gradient(to top, rgba(0,0,0,.74), transparent); z-index: 2; }
.cover-kicker { display: block; font: 700 5.6cqw/1.2 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.78); margin-bottom: 2.5cqw; }
.cover-title { display: block; font: 800 10.5cqw/1 var(--font-display); font-variation-settings: "wdth" 76; color: #fff; text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.cover.xs .cover-foot, .cover.xs .cover-native, .cover.xs .cover-tone { display: none; }

/* ── Cards & grids ─────────────────────── */
.card { display: flex; flex-direction: column; gap: 9px; min-width: 0; text-decoration: none; color: inherit; }
.card .cover { transition: transform .25s ease, box-shadow .25s ease; box-shadow: 0 1px 0 rgba(255,255,255,.05); }
.card:hover .cover, .card:focus-visible .cover { transform: translateY(-4px); box-shadow: 0 20px 38px -18px var(--acc); }
.card:focus-visible { outline: none; }
.card-title { font-weight: 650; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.card-genres { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-badge { position: absolute; top: 7px; left: 9px; z-index: 4; font: 700 10.5px/1 var(--font-body); padding: 4px 7px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(4px); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 30px 18px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } }
.shelf-row { display: grid; grid-auto-flow: column; grid-auto-columns: 164px; gap: 18px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 14px; scrollbar-width: thin; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
.shelf-row > * { scroll-snap-align: start; }
@media (max-width: 520px) { .shelf-row { grid-auto-columns: 140px; gap: 14px; } }

/* ── Sections ─────────────────────── */
main { padding-bottom: 40px; overflow-x: clip; }
.section { padding-block: 34px 6px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 20px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head h2 { font-size: clamp(22px, 2.6vw, 28px); font-weight: 750; }
.sec-head p { color: var(--muted); font-size: 14px; margin-top: 3px; max-width: 64ch; }
.link { color: var(--violet); font-weight: 600; font-size: 14px; text-decoration: none; background: none; border: 0; cursor: pointer; padding: 0; }
.link:hover { text-decoration: underline; text-underline-offset: 4px; }
.page-head { position: relative; padding-block: 38px 18px; }
.page-head h1 { font-size: clamp(32px, 4.6vw, 48px); font-weight: 800; }
.page-head p { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.aurora { position: absolute; inset: -40px -10vw auto; height: 320px; z-index: -1; pointer-events: none; opacity: .55; background: radial-gradient(40% 60% at 15% 30%, color-mix(in oklab, #8b5cf6 45%, transparent), transparent 70%), radial-gradient(35% 55% at 60% 10%, color-mix(in oklab, #ec4899 30%, transparent), transparent 70%), radial-gradient(30% 50% at 90% 40%, color-mix(in oklab, #06b6d4 30%, transparent), transparent 70%); filter: blur(10px); }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--faint); margin-top: 14px; }
.note svg { flex-shrink: 0; margin-top: 2px; }
.empty { border: 1px dashed var(--line-strong); border-radius: 16px; padding: 28px 22px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }

/* ── Hero ─────────────────────── */
.hero { position: relative; isolation: isolate; padding-block: 44px 30px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 40px; align-items: center; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 99px; border: 1px solid color-mix(in oklab, var(--amber) 45%, transparent); color: var(--amber); background: color-mix(in oklab, var(--amber) 10%, transparent); font-size: 13px; font-weight: 650; }
.hero h1 { font-size: clamp(38px, 6vw, 72px); line-height: .95; font-weight: 800; margin-top: 18px; font-variation-settings: "wdth" 88; }
.hero-alt { margin-top: 10px; color: var(--muted); font-size: 16px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
.hero-quote { margin-top: 18px; font-size: 17px; line-height: 1.6; max-width: 56ch; padding-left: 16px; border-left: 3px solid; border-image: var(--brand) 1; }
.hero-quote cite { display: block; font-style: normal; font-size: 12.5px; color: var(--faint); margin-top: 6px; letter-spacing: .02em; }
.hero-genres { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero-nav { display: flex; align-items: center; gap: 10px; margin-top: 26px; }
.dots { display: flex; gap: 6px; }
.dots button { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: var(--line-strong); cursor: pointer; transition: width .25s, background .25s; }
.dots button[aria-current="true"] { width: 30px; background: var(--brand); }
.hero-art { position: relative; justify-self: center; width: min(330px, 80vw); }
.hero-art .back { position: absolute; width: 74%; right: -18%; top: 9%; transform: rotate(8deg); opacity: .65; filter: saturate(.9); }
.hero-art .front { position: relative; transform: rotate(-3deg); box-shadow: 0 30px 70px -20px var(--acc), 0 0 0 1px rgba(255,255,255,.08); border-radius: 16px; }
.hero-stat { position: absolute; left: -22%; top: 42%; z-index: 5; background: var(--brand); color: var(--on-brand); border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow); min-width: 150px; }
.hero-stat .k { font-size: 11.5px; opacity: .85; font-weight: 600; letter-spacing: .03em; }
.hero-stat .v { font: 800 30px/1.05 var(--font-display); }
.hero-stat .s { font-size: 12px; opacity: .9; }
.hero-glow { position: absolute; inset: -10% -20% -10% -20%; z-index: -1; background: radial-gradient(closest-side, color-mix(in oklab, var(--acc) 45%, transparent), transparent); filter: blur(20px); opacity: .7; }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .hero-art { order: -1; width: min(230px, 62vw); }
  .hero-stat { left: auto; right: -20%; top: auto; bottom: -5%; min-width: 0; padding: 10px 12px; }
  .hero-stat .v { font-size: 24px; }
}

/* ── Facts strip & origin cards ─────── */
.strip { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; padding: 16px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 14px; color: var(--muted); }
.strip b { font: 800 22px/1 var(--font-display); color: var(--text); margin-right: 6px; }
.strip .src { margin-left: auto; font-size: 12.5px; color: var(--faint); }
.origins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .origins { grid-template-columns: minmax(0, 1fr); } }
.origin { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; min-height: 190px; border-radius: 20px; padding: 20px 22px; text-decoration: none; border: 1px solid color-mix(in oklab, var(--c) 40%, var(--line)); background: linear-gradient(150deg, color-mix(in oklab, var(--c) 20%, var(--surface)), var(--surface) 70%); transition: transform .2s, box-shadow .2s; }
.origin:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -22px var(--c); }
.origin .o-native { font-size: 46px; line-height: 1; color: var(--c); opacity: .95; }
.origin h3 { font-size: 26px; font-weight: 800; margin-top: 12px; }
.origin p { color: var(--muted); font-size: 14px; }
.origin .o-blurb { max-width: 52%; margin-top: 18px; }
.origin .fan { position: absolute; right: 16px; bottom: -30px; display: flex; z-index: -1; }
.origin .fan .cover { width: 66px; margin-left: -24px; box-shadow: var(--shadow); }
.origin .fan .cover:nth-child(1) { transform: rotate(-10deg) translateY(10px); }
.origin .fan .cover:nth-child(2) { transform: rotate(-2deg); }
.origin .fan .cover:nth-child(3) { transform: rotate(7deg) translateY(6px); }

/* ── Ranked lists ─────────────────────── */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { height: 36px; padding: 0 15px; border-radius: 99px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.rank-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 28px; }
@media (max-width: 760px) { .rank-list { grid-template-columns: minmax(0, 1fr); } }
.rank-item { display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 16px; text-decoration: none; min-width: 0; }
.rank-item:hover { background: var(--surface); }
.rank-item.top { background: linear-gradient(90deg, color-mix(in oklab, #8b5cf6 13%, transparent), transparent); }
.numeral { width: 56px; flex-shrink: 0; text-align: right; font: 800 46px/1 var(--font-display); font-variation-settings: "wdth" 80; background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rank-item .cover { width: 50px; flex-shrink: 0; border-radius: 7px; }
.rank-body { min-width: 0; flex: 1; }
.rank-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
"use strict";
const { useState, useEffect, useMemo, useRef, useCallback, useContext, createContext } = React;
const html = htm.bind(React.createElement);

/* ───────── Catalog ───────── */
const DATA = JSON.parse(document.getElementById("catalog").textContent);
const SERIES = DATA.series;
const BY_ID = new Map(SERIES.map((s) => [s.id, s]));
const SYNCED = DATA.syncedAt;

const TYPES = {
  MANGA: { label: "Manga", origin: "Japan", native: "漫画", lang: "ja", blurb: "Japanese comics, read right to left." },
  MANHWA: { label: "Manhwa", origin: "South Korea", native: "만화", lang: "ko", blurb: "Korean comics and full-colour webtoons." },
  MANHUA: { label: "Manhua", origin: "China", native: "漫画", lang: "zh", blurb: "Chinese comics, from wuxia epics to cultivation." },
};
const TYPE_KEYS = Object.keys(TYPES);
const STATUS = { ONGOING: "Ongoing", COMPLETED: "Completed", HIATUS: "On hiatus", CANCELLED: "Cancelled", UPCOMING: "Upcoming", UNKNOWN: "Unknown" };
const DEMO = { SHOUNEN: "Shounen", SHOUJO: "Shoujo", SEINEN: "Seinen", JOSEI: "Josei", KODOMO: "Kids" };
const SHELF = [
  ["READING", "Reading"],
  ["PLAN_TO_READ", "Plan to read"],
  ["COMPLETED", "Completed"],
  ["ON_HOLD", "On hold"],
  ["DROPPED", "Dropped"],
];
const SHELF_LABEL = Object.fromEntries(SHELF);

/* Same colour system as the MangaForEver app (packages/shared/src/design.ts). */
const GENRE_COLORS = {
  action: "#f43f5e", adventure: "#f59e0b", comedy: "#eab308", drama: "#a855f7", fantasy: "#8b5cf6",
  historical: "#d97706", horror: "#dc2626", mystery: "#3b82f6", psychological: "#d946ef", romance: "#ec4899",
  "sci-fi": "#06b6d4", "slice-of-life": "#10b981", sports: "#f97316", supernatural: "#6366f1", thriller: "#64748b",
  ecchi: "#fb7185", mecha: "#94a3b8", music: "#14b8a6",
};
const COVER_PALETTES = {
  action: ["#3b0a1f", "#ff4d6d"], adventure: ["#0e2a3b", "#ffb020"], comedy: ["#3a1550", "#ffd23f"],
  drama: ["#2a1142", "#c084fc"], fantasy: ["#191447", "#a78bfa"], historical: ["#33200c", "#f4a259"],
  horror: ["#170707", "#ef233c"], mystery: ["#0a1631", "#fbbf24"], psychological: ["#1f1236", "#f472b6"],
  romance: ["#3d0f2c", "#fb7185"], "sci-fi": ["#06202f", "#22d3ee"], "slice-of-life": ["#0c2e2a", "#6ee7b7"],
  sports: ["#0c1f47", "#fb923c"], supernatural: ["#141339", "#818cf8"], thriller: ["#111318", "#f43f5e"],
};
const PALETTE_KEYS = Object.keys(COVER_PALETTES);
const slugOf = (g) => g.toLowerCase().replace(/\s+/g, "-");
const genreColor = (g) => GENRE_COLORS[slugOf(g)] || "#8b5cf6";

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function coverArt(title, slugs) {
  const seed = hashString(title);
  const known = slugs.filter((g) => COVER_PALETTES[g]);
  const primary = known.length ? known[seed % known.length] : PALETTE_KEYS[seed % PALETTE_KEYS.length];
  const secondary = slugs.find((g) => g !== primary && GENRE_COLORS[g]);
  const [bg, accent] = COVER_PALETTES[primary];
  const motifs = ["sun", "slash", "burst", "rings", "bars"];
  return { bg, accent, accent2: secondary ? GENRE_COLORS[secondary] : "#ffffff", motif: motifs[seed % motifs.length], seed };
}
function coverBackground(a) {
  const x = 22 + (a.seed % 50), y = 18 + ((a.seed >> 4) % 34), ang = 100 + ((a.seed >> 8) % 60);
  const glow = `radial-gradient(120% 80% at ${100 - x}% 0%, ${a.accent}55, transparent 60%)`;
  const base = `linear-gradient(165deg, ${a.bg} 30%, color-mix(in oklab, ${a.bg} 70%, ${a.accent2}) 100%)`;
  let motif;
  switch (a.motif) {
    case "sun": motif = `radial-gradient(circle at ${x}% ${y}%, ${a.accent} 0 17%, transparent 17.6%), radial-gradient(circle at ${x}% ${y}%, ${a.accent}33 0 26%, transparent 26.6%)`; break;
    case "slash": motif = `linear-gradient(${ang}deg, transparent 0 36%, ${a.accent} 36% 49%, transparent 49% 53%, ${a.accent2}aa 53% 56%, transparent 56%)`; break;
    case "burst": motif = `repeating-conic-gradient(from ${a.seed % 90}deg at ${x}% ${y + 10}%, ${a.accent}66 0 3deg, transparent 3deg 10deg)`; break;
    case "rings": motif = `repeating-radial-gradient(circle at ${x}% ${y + 8}%, ${a.accent}aa 0 3px, transparent 3px 16px)`; break;
    default: motif = `repeating-linear-gradient(${ang}deg, ${a.accent}88 0 10px, transparent 10px 26px)`;
  }
  return `${motif}, ${glow}, ${base}`;
}

const CJK = /[぀-ヿ㐀-鿿가-힯豈-﫿]/;
const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/[:!?.,'’"“”\-–—~・·×&()\[\]/]/g, " ").replace(/\s+/g, " ").trim();
function trigrams(s) {
  const t = new Set(), p = `  ${s} `;
  for (let i = 0; i < p.length - 2; i++) t.add(p.slice(i, i + 3));
  return t;
}
const popMax = Math.max(...SERIES.map((s) => s.pop || 0));
const ALL_GENRES = [...new Set(SERIES.flatMap((s) => s.genres))].sort();
const YEARS = SERIES.map((s) => s.year).filter(Boolean);
const YEAR_MIN = Math.min(...YEARS), YEAR_MAX = Math.max(...YEARS);

for (const s of SERIES) {
  s.slugs = s.genres.map(slugOf);
  s.art = coverArt(s.title, s.slugs);
  s.bg = coverBackground(s.art);
  s.nativeShown = s.native && CJK.test(s.native) ? s.native : null;
  s.titleN = norm(s.title);
  s.hay = norm([s.title, s.romaji, s.native, ...s.authors, ...s.artists].filter(Boolean).join(" | "));
  s.tri = trigrams(norm([s.title, s.romaji].filter(Boolean).join(" ")));
  s.tagSet = new Set(s.tags);
}

/* Rank positions within the catalog, by AniList popularity. */
const BY_POP = [...SERIES].sort((a, b) => (b.pop || 0) - (a.pop || 0));
BY_POP.forEach((s, i) => (s.catRank = i + 1));

/* ───────── Formatting ───────── */
const fmtK = (n) => (n == null ? "—" : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e4 ? `${Math.round(n / 1e3)}K` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}K` : String(n));
const fmtDate = (iso) => (iso ? new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : null);
const fmtScore = (n) => (n == null ? "—" : Number(n).toFixed(1));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function ago(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return `${Math.floor(d / 60)} min ago`;
  if (d < 86400) return `${Math.floor(d / 3600)} h ago`;
  if (d < 86400 * 30) return plural(Math.floor(d / 86400), "day") + " ago";
  return new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
function published(s) {
  if (s.start && s.end) return `${fmtDate(s.start)} – ${fmtDate(s.end)}`;
  if (s.start && s.status === "ONGOING") return `Since ${fmtDate(s.start)}`;
  if (s.start) return fmtDate(s.start);
  return s.year ? String(s.year) : "Not listed";
}
function chapterLine(s) {
  if (s.ch != null) return `${s.ch} chapters${s.vol ? ` · ${s.vol} volumes` : ""}`;
  if (s.vol) return `${s.vol} volumes`;
  return s.status === "ONGOING" ? "Still running, no final count yet" : "Not listed on AniList";
}
const anilistUrl = (s) => (s.al ? `https://anilist.co/manga/${s.al}` : null);

/* ───────── Search ───────── */
function searchSeries(q, list = SERIES) {
  const n = norm(q);
  if (!n) return list;
  const toks = n.split(" ");
  const hits = [];
  for (const s of list) {
    if (!toks.every((t) => s.hay.includes(t))) continue;
    let r = s.titleN === n ? 100 : s.titleN.startsWith(n) ? 60 : s.titleN.includes(n) ? 40 : 10;
    hits.push([r + Math.log10((s.pop || 0) + 10), s]);
  }
  return hits.sort((a, b) => b[0] - a[0]).map((h) => h[1]);
}
/** Typo-tolerant fallback (trigram similarity, like the app's pg_trgm search). */
function similarTitles(q, k = 5) {
  const t = trigrams(norm(q));
  if (!t.size) return [];
  return SERIES.map((s) => {
    let inter = 0;
    for (const g of t) if (s.tri.has(g)) inter++;
    return [inter / (t.size + s.tri.size - inter), s];
  })
    .filter((x) => x[0] >= 0.22)
    .sort((a, b) => b[0] - a[0])
    .slice(0, k)
    .map((x) => x[1]);
}

/* ───────── Similar series & recommendations ───────── */
function overlap(a, b) {
  const g = a.genres.filter((x) => b.genres.includes(x));
  const t = a.tags.filter((x) => b.tagSet.has(x));
  return { g, t };
}
function similarTo(s, k = 12) {
  const out = [];
  for (const o of SERIES) {
    if (o === s) continue;
    const { g, t } = overlap(s, o);
    if (!g.length) continue;
    const union = new Set([...s.genres, ...o.genres]).size;
    const score = (2 * g.length) / union + 0.35 * t.length + (o.type === s.type ? 0.25 : 0) + 0.04 * Math.log10((o.pop || 0) + 10);
    out.push({ s: o, score, why: [...g.slice(0, 2), ...t.slice(0, 1)] });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, k);
}
function recommend(entries, ratings, k = 12) {
  const ids = Object.keys(entries);
  if (!ids.length) return [];
  const gw = {}, tw = {};
  const sources = [];
  for (const id of ids) {
    const s = BY_ID.get(id), e = entries[id];
    if (!s) continue;
    const score = ratings[id];
    let w = e.status === "DROPPED" ? -0.6 : 1 + (score ? (score - 6) / 4 : 0) + (e.fav ? 0.6 : 0);
    if (w > 0) sources.push({ s, w });
    for (const g of s.genres) gw[g] = (gw[g] || 0) + w;
    for (const t of s.tags) tw[t] = (tw[t] || 0) + w * 0.5;
  }
  const res = [];
  for (const c of SERIES) {
    if (entries[c.id]) continue;
    let sc = 0;
    for (const g of c.genres) sc += gw[g] || 0;
    sc = sc / Math.sqrt(c.genres.length || 1);
    for (const t of c.tags) sc += (tw[t] || 0) * 0.6;
    sc += 0.12 * Math.log10((c.pop || 0) + 10) + (c.score ? (c.score - 7) * 0.15 : 0);
    if (sc <= 0) continue;
    let best = null;
    for (const src of sources) {
      const o = overlap(src.s, c);
      const v = (o.g.length + o.t.length * 0.7) * src.w;
      if (!best || v > best.v) best = { v, src: src.s, why: [...o.g.slice(0, 2), ...o.t.slice(0, 1)] };
    }
    res.push({ s: c, score: sc, because: best && best.v > 0 ? best.src : null, why: best ? best.why : [] });
  }
  return res.sort((a, b) => b.score - a.score).slice(0, k);
}

/* ───────── Storage helpers ───────── */
const LS_KEY = "mangaforever.shelf.v1";
const emptyShelf = () => ({ entries: {}, history: [], ratings: {} });
function readLocal() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    return v && typeof v === "object" ? { ...emptyShelf(), ...v } : emptyShelf();
  } catch { return emptyShelf(); }
}
function writeLocal(v) { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch { /* storage blocked */ } }
function readTheme() { try { return localStorage.getItem("mangaforever.theme") || "system"; } catch { return "system"; } }
function applyTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("mangaforever.theme", t); } catch { /* ignore */ }
}
/** Drop entries that point at series no longer in the catalog and keep the shape sane. */
function cleanShelf(v) {
  const out = emptyShelf();
  if (!v || typeof v !== "object") return out;
  for (const [id, e] of Object.entries(v.entries || {})) {
    if (BY_ID.has(id) && e && SHELF_LABEL[e.status]) out.entries[id] = { status: e.status, ch: Math.max(0, Number(e.ch) || 0), fav: !!e.fav, at: Number(e.at) || Date.now() };
  }
  out.history = (Array.isArray(v.history) ? v.history : []).filter((x) => BY_ID.has(x.id)).slice(0, 40);
  for (const [id, n] of Object.entries(v.ratings || {})) if (BY_ID.has(id) && n >= 1 && n <= 10) out.ratings[id] = Math.round(n);
  return out;
}

const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

/* ───────── Shared components ───────── */
const ICONS = {
  search: ["M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14z", "M21 21l-4.3-4.3"],
  star: ["M12 3.6l2.55 5.2 5.75.84-4.16 4.05.98 5.72L12 16.7l-5.12 2.7.98-5.72L3.7 9.64l5.75-.84z"],
  heart: ["M12 20s-7.2-4.5-9.3-8.8C1.2 8 3.3 5 6.6 5c2 0 3.3 1.1 4.1 2.4L12 9.2l1.3-1.8C14.1 6.1 15.4 5 17.4 5c3.3 0 5.4 3 3.9 6.2C19.2 15.5 12 20 12 20z"],
  plus: ["M12 5v14", "M5 12h14"],
  minus: ["M5 12h14"],
  check: ["M5 12.5l4.5 4.5L19 7"],
  left: ["M15 18l-6-6 6-6"],

function Icon({ name, size = 16, fill = false, className }) {
  return html`<svg className=${className} width=${size} height=${size} viewBox="0 0 24 24" fill=${fill ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${ICONS[name].map((d, i) => html`<path key=${i} d=${d} />`)}</svg>`;
}

function Cover({ s, size = "", className = "", style }) {
  const n = s.nativeShown;
  const len = n ? [...n].length : 0;
  const nfs = len <= 3 ? "17cqw" : len <= 5 ? "14.5cqw" : len <= 8 ? "12cqw" : len <= 12 ? "10cqw" : "8.4cqw";
  return html`<div className=${`cover ${size} ${className}`} role="img" aria-label=${`Generated cover for ${s.title}`} style=${{ background: s.bg, "--acc": s.art.accent, ...style }}>
    <span className="cover-tone"></span>
    ${n && html`<span className=${"cover-native n-" + s.type} lang=${TYPES[s.type].lang} style=${{ "--nfs": nfs }} aria-hidden="true">${n}</span>`}
    <span className="cover-foot" aria-hidden="true">
      <span className="cover-kicker">${TYPES[s.type].label}${s.year ? " · " + s.year : ""}</span>
      <span className="cover-title">${s.title}</span>
    </span>
  </div>`;
}

function SeriesLink({ s, className, children, style }) {
  const { go } = useApp();
  return html`<a className=${className} style=${style} href=${"#series-" + s.id} onClick=${(e) => { e.preventDefault(); go("series", { id: s.id }); }}>${children}</a>`;
}

function TypeTag({ type }) {
  return html`<span className=${"tt tt-" + type}>${TYPES[type].label}</span>`;
}
function Score({ value, label = "AniList average score", size = 13 }) {
  if (value == null) return null;
  return html`<span className="score" title=${label}><${Icon} name="star" size=${size} fill=${true} />${fmtScore(value)}</span>`;
}
function GenreChip({ g, pressed, onClick, count }) {
  const props = { className: "chip" + (onClick ? "" : " chip-static"), style: { "--c": genreColor(g) } };
  return onClick
    ? html`<button type="button" ...${props} aria-pressed=${!!pressed} onClick=${onClick}><span className="dot"></span>${g}${count != null && html`<span className="n">${count}</span>`}</button>`
    : html`<span ...${props}><span className="dot"></span>${g}</span>`;
}

function Card({ s, badge, sub }) {

function Row({ items, render }) {

function Section({ title, desc, action, children, id }) {

/** Shelf status menu, used on the series page and in the hero. */
function ShelfButton({ s, compact }) {
  const { shelf, setStatus, removeEntry } = useApp();
  const e = shelf.entries[s.id];
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const close = (ev) => { if (ref.current && !ref.current.contains(ev.target)) setOpen(false); };
    const esc = (ev) => ev.key === "Escape" && setOpen(false);
    document.addEventListener("pointerdown", close);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("pointerdown", close); document.removeEventListener("keydown", esc); };
  }, [open]);
  return html`<div className="menu-wrap" ref=${ref}>
    <button type="button" className=${"btn " + (e ? "" : "btn-brand") + (compact ? " btn-sm" : "")} aria-haspopup="menu" aria-expanded=${open} onClick=${() => setOpen((o) => !o)}>
      <${Icon} name=${e ? "check" : "plus"} size=${17} />${e ? SHELF_LABEL[e.status] : "Add to shelf"}<${Icon} name="down" size=${15} />
    </button>
    ${open && html`<div className="menu" role="menu">
      ${SHELF.map(([v, l]) => html`<button key=${v} type="button" role="menuitemradio" aria-checked=${e?.status === v} onClick=${() => { setStatus(s.id, v); setOpen(false); }}>
        <span style=${{ width: "16px" }}>${e?.status === v && html`<${Icon} name="check" size=${15} />`}</span>${l}</button>`)}
      ${e && html`<hr /><button type="button" role="menuitem" onClick=${() => { removeEntry(s.id); setOpen(false); }}><span style=${{ width: "16px" }}><${Icon} name="trash" size=${15} /></span>Remove from shelf</button>`}
    </div>`}
  </div>`;
}

function FavButton({ s, compact }) {
  const { shelf, toggleFav } = useApp();
  const on = !!shelf.entries[s.id]?.fav;
  return html`<button type="button" className=${"btn" + (compact ? " btn-sm" : "")} aria-pressed=${on} onClick=${() => toggleFav(s.id)}>
    <${Icon} name="heart" size=${17} fill=${on} />${on ? "Favorited" : "Favorite"}
  </button>`;
}

function useProfiles(ids) {
  const { rt } = useApp();
  const [map, setMap] = useState({});
  const key = [...new Set(ids)].sort().join(",");
  useEffect(() => {
    if (!rt.user || !key) return;
    let live = true;
    Promise.resolve(rt.user.profiles(key.split(","))).then((p) => live && p && setMap(p)).catch(() => {});
    return () => { live = false; };
  }, [rt.user, key]);
  return map;
}

function Header() {
  const { go, theme, setTheme } = useApp();
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(-1);
  const input = useRef(null);
  const box = useRef(null);
  const results = useMemo(() => (q.trim() ? searchSeries(q).slice(0, 6) : []), [q]);
  const fuzzy = useMemo(() => (q.trim().length > 2 && !results.length ? similarTitles(q, 4) : []), [q, results]);
  const list = results.length ? results : fuzzy;
  useEffect(() => {
    const onKey = (e) => {
      const tag = document.activeElement?.tagName || "";
      if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); input.current?.focus(); }
    };
    const away = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    window.addEventListener("keydown", onKey);
    document.addEventListener("pointerdown", away);
    return () => { window.removeEventListener("keydown", onKey); document.removeEventListener("pointerdown", away); };
  }, []);
  const submit = (e) => {
    e.preventDefault();
    if (active >= 0 && list[active]) go("series", { id: list[active].id });
    else go("explore", { preset: { q: q.trim() } });
    setOpen(false);
    input.current?.blur();
  };
  const nextTheme = { system: "light", light: "dark", dark: "system" }[theme];
  const themeIcon = { system: "monitor", light: "sun", dark: "moon" }[theme];
  return html`<header className="hdr">
    <div className="wrap">
      <div className="hdr-in">
        <a className="logo" href="#" onClick=${(e) => { e.preventDefault(); go("home"); }} aria-label="MangaForEver home">
          <span className="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span className="word">Manga<span className="text-brand">For</span>Ever</span>
        </a>
        <nav className="nav" aria-label="Main"><${NavLinks} /></nav>
        <div className="hdr-tools">
          <form className="search" role="search" onSubmit=${submit} ref=${box}>
            <${Icon} name="search" size=${17} />
            <label className="sr" htmlFor="q">Search titles and creators</label>
            <input id="q" ref=${input} type="search" autoComplete="off" placeholder="Search titles, creators…" value=${q}
              onChange=${(e) => { setQ(e.target.value); setOpen(true); setActive(-1); }}
              onFocus=${() => setOpen(true)}
              onKeyDown=${(e) => {
                if (e.key === "ArrowDown") { e.preventDefault(); setActive((a) => Math.min(a + 1, list.length - 1)); }
                if (e.key === "ArrowUp") { e.preventDefault(); setActive((a) => Math.max(a - 1, -1)); }
                if (e.key === "Escape") setOpen(false);
              }}
              aria-expanded=${open && list.length > 0} aria-controls="suggest" />
            <kbd aria-hidden="true">/</kbd>
            ${open && q.trim() && html`<div className="suggest" id="suggest" role="listbox">
              ${!results.length && fuzzy.length > 0 && html`<p className="s-m" style=${{ padding: "6px 8px" }}>No exact match. Did you mean:</p>`}
              ${!list.length && html`<p className="s-m" style=${{ padding: "8px" }}>No titles or creators match "${q.trim()}".</p>`}
              ${list.map((s, i) => html`<a key=${s.id} href=${"#series-" + s.id} role="option" data-active=${i === active} aria-selected=${i === active}
                onClick=${(e) => { e.preventDefault(); go("series", { id: s.id }); setOpen(false); }}>
                <${Cover} s=${s} size="xs" />
                <span style=${{ minWidth: 0 }}><span className="s-t" style=${{ display: "block" }}>${s.title}</span>
                <span className="s-m">${TYPES[s.type].label} · ${s.year || "—"} · ${s.authors[0] || s.artists[0] || "Creator not listed"}</span></span>
              </a>`)}
              ${results.length > 0 && html`<a href="#explore" className="all" onClick=${submit}>See all results for "${q.trim()}"</a>`}
            </div>`}
          </form>
          <button type="button" className="icon-btn" onClick=${() => setTheme(nextTheme)} aria-label=${`Theme: ${theme}. Switch to ${nextTheme}`} title=${`Theme: ${theme}`}>
            <${Icon} name=${themeIcon} size=${18} />
          </button>
        </div>
      </div>
      <nav className="subnav nav" aria-label="Sections"><${NavLinks} /></nav>
    </div>
  </header>`;
}

/* ───────── Explore ───────── */
const SORTS = [
  ["popularity", "Most popular"],
  ["score", "Highest AniList score"],
  ["readers", "Reader rating"],
  ["newest", "Newest first"],
  ["oldest", "Oldest first"],
  ["chapters", "Most chapters"],
  ["title", "Title A–Z"],
];
const DEFAULT_EX = { q: "", types: [], genres: [], genreMode: "all", status: [], demo: [], yearFrom: "", yearTo: "", minScore: "", sort: "popularity" };

function applyFilters(ex, agg, skip) {
  let list = ex.q ? searchSeries(ex.q) : SERIES;
  return list.filter((s) =>
    (!ex.types.length || ex.types.includes(s.type)) &&
    (skip === "genres" || !ex.genres.length || (ex.genreMode === "all" ? ex.genres.every((g) => s.genres.includes(g)) : ex.genres.some((g) => s.genres.includes(g)))) &&
    (!ex.status.length || ex.status.includes(s.status)) &&
    (!ex.demo.length || ex.demo.includes(s.demo)) &&
    (!ex.yearFrom || (s.year && s.year >= +ex.yearFrom)) &&
    (!ex.yearTo || (s.year && s.year <= +ex.yearTo)) &&
    (!ex.minScore || (s.score != null && s.score >= +ex.minScore)));
}
function sortList(list, sort, agg, hasQuery) {
  const avg = (s) => { const r = agg.rating[s.id]; return r ? r.sum / r.n : -1; };
  const by = {
    popularity: (a, b) => (b.pop || 0) - (a.pop || 0),
    score: (a, b) => (b.score ?? -1) - (a.score ?? -1) || (b.pop || 0) - (a.pop || 0),
    readers: (a, b) => avg(b) - avg(a) || (b.pop || 0) - (a.pop || 0),
    newest: (a, b) => (b.start || String(b.year || 0)).localeCompare(a.start || String(a.year || 0)),
    oldest: (a, b) => (a.start || "9999").localeCompare(b.start || "9999"),
    chapters: (a, b) => (b.ch ?? -1) - (a.ch ?? -1),
    title: (a, b) => a.title.localeCompare(b.title),
  }[sort];
  if (hasQuery && sort === "popularity") return list; // keep search relevance order
  return [...list].sort(by);
}

function Toggles({ values, options, onChange, colorOf }) {
  return html`<div className="fchips">${options.map(([v, l, n]) => html`<button key=${v} type="button" className="chip" aria-pressed=${values.includes(v)} style=${colorOf ? { "--c": colorOf(v) } : undefined}
    onClick=${() => onChange(values.includes(v) ? values.filter((x) => x !== v) : [...values, v])}>${colorOf && html`<span className="dot"></span>`}${l}${n != null && html`<span className="n">${n}</span>`}</button>`)}</div>`;
}

            </label>
          </div>

          </div>
          <div className="fgroup"><h3>Genres
            <span className="seg" role="group" aria-label="Genre matching">
              <button type="button" aria-pressed=${ex.genreMode === "all"} onClick=${() => set({ genreMode: "all" })}>Match all</button>
              <button type="button" aria-pressed=${ex.genreMode === "any"} onClick=${() => set({ genreMode: "any" })}>Match any</button>
            </span></h3>
            <${Toggles} values=${ex.genres} onChange=${(genres) => set({ genres })} options=${ALL_GENRES.map((g) => [g, g, genreCounts[g] || 0])} colorOf=${genreColor} />

function ReviewForm({ s, initial, onDone }) {
  const { saveReview } = useApp();
  const [title, setTitle] = useState(initial?.title || "");
  const [body, setBody] = useState(initial?.body || "");
  const [spoiler, setSpoiler] = useState(!!initial?.spoiler);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    if (title.trim().length < 3) return setErr("Give your review a title of at least 3 characters.");
    if (body.trim().length < 30) return setErr(`Write at least 30 characters (${body.trim().length} so far).`);
    setErr("");
    setBusy(true);
    const ok = await saveReview(s.id, { title: title.trim().slice(0, 120), body: body.trim().slice(0, 5000), spoiler });
    setBusy(false);
    if (ok) onDone();
  };
  return html`<form className="form panel" onSubmit=${submit} noValidate>
    <h3 style=${{ marginBottom: 0 }}>${initial ? "Edit your review" : `Review ${s.title}`}</h3>
    <label className="field" htmlFor="rv-title">Title
      <input id="rv-title" className="input" maxLength="120" value=${title} onChange=${(e) => setTitle(e.target.value)} placeholder="One line that sums it up" /></label>
    <label className="field" htmlFor="rv-body">Review
      <textarea id="rv-body" maxLength="5000" value=${body} onChange=${(e) => setBody(e.target.value)} placeholder="What works, what doesn't, and who it's for."></textarea></label>
    <label className="check" htmlFor="rv-spoiler"><input id="rv-spoiler" type="checkbox" checked=${spoiler} onChange=${(e) => setSpoiler(e.target.checked)} /> Contains spoilers (readers must tap to reveal)</label>
    ${err && html`<p className="err" role="alert">${err}</p>`}
    <div className="actions" style=${{ marginTop: 0 }}>
      <button type="submit" className="btn btn-brand" disabled=${busy}>${busy ? "Publishing…" : initial ? "Save changes" : "Publish review"}</button>
      <button type="button" className="btn" onClick=${onDone}>Cancel</button>
    </div>
    <p className="note" style=${{ marginTop: 0 }}>Reviews are public to everyone who can open this page. Your rating, if you gave one, shows beside it.</p>
  </form>`;
}

/* ───────── Rankings ───────── */
function Rankings() {
  const { agg } = useApp();
  const [kind, setKind] = useState("popular");
  const [type, setType] = useState("ALL");
  const [n, setN] = useState(50);
  const pool = SERIES.filter((s) => type === "ALL" || s.type === type);
  let list, val, label, max;
  if (kind === "popular") {
    list = [...pool].sort((a, b) => (b.pop || 0) - (a.pop || 0));
    max = list[0]?.pop || 1;
    val = (s) => [fmtK(s.pop) + " members", (s.pop || 0) / max];
    label = "AniList members tracking this series";
  } else if (kind === "score") {
    list = pool.filter((s) => s.score != null && (s.pop || 0) > 5000).sort((a, b) => b.score - a.score || b.pop - a.pop);
    val = (s) => [fmtScore(s.score) + " / 10", (s.score - 5) / 5];
    label = "AniList average score";
  } else {
    list = pool.filter((s) => agg.rating[s.id]).sort((a, b) => {
      const ra = agg.rating[a.id], rb = agg.rating[b.id];
      return rb.sum / rb.n - ra.sum / ra.n || rb.n - ra.n;
    });
    val = (s) => { const r = agg.rating[s.id]; return [`${fmtScore(r.sum / r.n)} · ${plural(r.n, "rating")}`, r.sum / r.n / 10]; };
    label = "Average rating from MangaForEver readers";
  }
  const desc = {
    popular: "How many AniList members track each series. The broadest measure of reach.",
    score: "AniList's average member score, for series with more than 5,000 members so a handful of votes can't top the chart.",
    readers: "Average ratings from people using this MangaForEver page. Rate any series to add yours.",
  }[kind];
  return html`<main>
    <div className="wrap page-head"><div className="aurora" aria-hidden="true"></div>
      <h1>Rankings</h1><p>${desc}</p>
    </div>
    <div className="wrap">
      <div style=${{ display: "flex", flexWrap: "wrap", gap: "12px 20px", justifyContent: "space-between", marginBottom: "22px" }}>
        <${Tabs} label="Ranking" value=${kind} onChange=${(k) => { setKind(k); setN(50); }} options=${[["popular", "Most popular"], ["score", "Highest rated"], ["readers", "Reader favorites"]]} />
        <${Tabs} label="Origin" value=${type} onChange=${(t) => { setType(t); setN(50); }} options=${[["ALL", "All origins"], ...TYPE_KEYS.map((k) => [k, TYPES[k].label])]} />
      </div>
      ${list.length
        ? html`<ol className="rank-list">${list.slice(0, n).map((s, i) => { const [v, ratio] = val(s); return html`<${RankItem} key=${s.id} s=${s} rank=${i + 1} value=${v} valueLabel=${label} ratio=${ratio} />`; })}</ol>
          ${n < list.length && html`<div className="more"><button type="button" className="btn" onClick=${() => setN((x) => x + 50)}>Show the next ${Math.min(50, list.length - n)}</button></div>`}`
        : html`<div className="empty"><strong>No reader ratings yet</strong>Open any series and rate it from 1 to 10. Rankings appear here as soon as readers rate.</div>`}
      <${Note}>${kind === "readers" ? "Reader ratings come only from people using this page; nothing is imported or estimated." : `Figures from AniList, synced ${fmtDate(SYNCED)}. They are AniList's numbers, not sales charts.`}<//>
    </div>
  </main>`;
}

/* ───────── App: routing, shelf storage, shared community data ───────── */
const PAGES = ["explore", "rankings", "seasonal", "shelf"];
function parseHash() {
  let h = "";
  try { h = decodeURIComponent((location.hash || "").slice(1)); } catch { h = ""; }
  if (h.startsWith("series-") && BY_ID.has(h.slice(7))) return { page: "series", id: h.slice(7) };
  if (PAGES.includes(h)) return { page: h };
  return { page: "home" };
}
function cleanCommunity(uid, d) {
  const out = { uid, ratings: {}, reviews: {}, helpful: {} };
  if (!d || typeof d !== "object") return out;
  for (const [sid, n] of Object.entries(d.ratings || {})) if (BY_ID.has(sid) && Number.isInteger(n) && n >= 1 && n <= 10) out.ratings[sid] = n;
  for (const [sid, r] of Object.entries(d.reviews || {})) {
    if (!BY_ID.has(sid) || !r || typeof r.title !== "string" || typeof r.body !== "string") continue;
    out.reviews[sid] = { title: r.title.slice(0, 120), body: r.body.slice(0, 5000), spoiler: !!r.spoiler, at: Number(r.at) || 0, edited: !!r.edited };
  }
  for (const k of Object.keys(d.helpful || {})) if (typeof k === "string" && k.includes("|")) out.helpful[k] = true;
  return out;
}
const plain = (c) => ({ ratings: { ...c.ratings }, reviews: JSON.parse(JSON.stringify(c.reviews)), helpful: { ...c.helpful } });
function mergeShelf(remote, local) {
  const out = { entries: { ...remote.entries }, history: [], ratings: { ...local.ratings, ...remote.ratings } };
  for (const [id, e] of Object.entries(local.entries)) if (!out.entries[id] || out.entries[id].at < e.at) out.entries[id] = e;
  const seen = new Set();
  out.history = [...remote.history, ...local.history].sort((a, b) => b.at - a.at).filter((h) => !seen.has(h.id) && seen.add(h.id)).slice(0, 40);
  return out;
}

function App() {
  const [route, setRoute] = useState(parseHash);
  const [theme, setThemeState] = useState(readTheme);
  const [shelf, setShelf] = useState(() => cleanShelf(readLocal()));
  const [rt, setRt] = useState({ mode: "local", ready: false, db: null, user: null, uid: null, isOwner: false, canWrite: null });
  const [comm, setComm] = useState([]);
  const [commReadOnly, setCommReadOnly] = useState(false);
  const [shelfLocalOnly, setShelfLocalOnly] = useState(false);
  const [ex, setEx] = useState(DEFAULT_EX);
  const [toasts, setToasts] = useState([]);
  const rtRef = useRef(rt);
  rtRef.current = rt;
  const latest = useRef(shelf);
  const dirty = useRef(false);
  const timer = useRef(null);
  const chain = useRef(Promise.resolve());
  const commChain = useRef(Promise.resolve());
  const mineRef = useRef(null);
  const localOnlyRef = useRef(false);

  const toast = useCallback((msg) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t.slice(-2), { id, msg }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2800);
  }, []);

  useEffect(() => { applyTheme(theme); }, [theme]);

  /* Routing: bare #tokens so links into the page work, and Back works inside it. */
  const go = useCallback((page, opts = {}) => {
    if (page === "explore" && opts.preset) setEx({ ...DEFAULT_EX, ...opts.preset });
    const next = page === "series" ? { page, id: opts.id } : { page };
    const token = page === "series" ? "series-" + opts.id : page === "home" ? "" : page;
    try {
      if (location.hash.slice(1) !== token) history.pushState(null, "", token ? "#" + token : location.pathname + location.search);
    } catch { /* history unavailable: state routing still works */ }
    setRoute(next);
    window.scrollTo({ top: 0 });
  }, []);
  const back = useCallback(() => {
    if (history.length > 1) history.back();
    else go("explore");
  }, [go]);
  useEffect(() => {
    const on = () => { setRoute(parseHash()); window.scrollTo({ top: 0 }); };
    window.addEventListener("popstate", on);
    window.addEventListener("hashchange", on);
    return () => { window.removeEventListener("popstate", on); window.removeEventListener("hashchange", on); };
  }, []);
  useEffect(() => {
    const base = "MangaForEver";
    const s = route.page === "series" ? BY_ID.get(route.id) : null;
    document.title = s ? `${s.title} · ${base}` : route.page === "home" ? base : `${NAV.find((n) => n[0] === route.page)?.[1] || ""} · ${base}`;
  }, [route]);

  /* Shelf persistence: the viewer's private db subtree when available, otherwise this browser. */
  const flush = useCallback(() => {
    if (!dirty.current) return;
    dirty.current = false;
    const v = latest.current;
    const r = rtRef.current;
    if (r.mode === "cloud" && !localOnlyRef.current) {
      chain.current = chain.current
        .then(() => r.db.doc(`data/users/${r.uid}/shelf`).set({ entries: v.entries, history: v.history, ratings: v.ratings, v: 1 }))
        .catch((err) => {
          if (err && err.code === "invalid_argument") {
            localOnlyRef.current = true;
            setShelfLocalOnly(true);
          } else if (err && err.code === "quota_exceeded") toast("Your shelf couldn't be saved: this page's storage is full.");
          writeLocal(latest.current);
        });
    } else writeLocal(v);
  }, [toast]);
  const updateShelf = useCallback((fn) => {
    setShelf((prev) => {
      const next = fn(prev);
      latest.current = next;
      return next;
    });
    dirty.current = true;
    clearTimeout(timer.current);
    timer.current = setTimeout(flush, 700);
  }, [flush]);
  useEffect(() => {
    const away = () => { if (document.visibilityState === "hidden") { clearTimeout(timer.current); flush(); } };
    document.addEventListener("visibilitychange", away);
    window.addEventListener("pagehide", flush);
    return () => { document.removeEventListener("visibilitychange", away); window.removeEventListener("pagehide", flush); };
  }, [flush]);

  /* Optional host storage capabilities. Everything works without them. */
  useEffect(() => {
    let live = true;
    (async () => {
      const c = window.claude;
      if (!c || typeof c.use !== "function") { setRt((r) => ({ ...r, ready: true })); return; }
      const [db, user] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);
      const uid = user ? await user.id() : null;
      const isOwner = user ? await user.isOwner() : false;
      const canWrite = user ? await user.can("data.write") : null;
      if (!live) return;
      if (db && uid) {
        try {
          const snap = await db.doc(`data/users/${uid}/shelf`).get();
          if (snap.exists) {
            const remote = cleanShelf(snap.data());
            setShelf((prev) => { const next = mergeShelf(remote, prev); latest.current = next; return next; });
          }
        } catch { /* fall back to what this browser has */ }
        setRt({ mode: "cloud", ready: true, db, user, uid, isOwner, canWrite });
      } else {
        setRt({ mode: "local", ready: true, db, user, uid, isOwner, canWrite });
      }
    })();
    return () => { live = false; };
  }, []);

  /* Shared ratings and reviews: one document per reader under community/<their id>. */
  useEffect(() => {
    if (!rt.db) return;
    let unsub = null;
    try {
      unsub = rt.db.collection("community").limit(1000).onSnapshot(
        (snap) => setComm(snap.docs.filter((d) => d.exists).map((d) => cleanCommunity(d.id, d.data()))),
        () => setComm((c) => c),
      );
    } catch { /* store unavailable for this view */ }
    return () => unsub && unsub();
  }, [rt.db]);

  const agg = useMemo(() => {
    const rating = {};
    const reviews = [];
    const helpful = {};
    for (const d of comm) for (const k of Object.keys(d.helpful)) if (!k.startsWith(d.uid + "|")) helpful[k] = (helpful[k] || 0) + 1;
    for (const d of comm) {
      for (const [sid, n] of Object.entries(d.ratings)) {
        const r = (rating[sid] ||= { sum: 0, n: 0, dist: Array(10).fill(0) });
        r.sum += n; r.n += 1; r.dist[n - 1] += 1;
      }
      for (const [sid, r] of Object.entries(d.reviews)) reviews.push({ ...r, uid: d.uid, sid, score: d.ratings[sid] || null, helpful: helpful[d.uid + "|" + sid] || 0 });
    }
    return { rating, reviews, mine: comm.find((d) => d.uid === rt.uid) || null };
  }, [comm, rt.uid]);
  useEffect(() => { mineRef.current = agg.mine ? plain(agg.mine) : mineRef.current; }, [agg.mine]);

  const commWritable = rt.mode === "cloud" && rt.canWrite !== false && !commReadOnly;
  const writeMine = useCallback((fn, okMsg) => {
    const r = rtRef.current;
    const next = fn(mineRef.current ? plain(mineRef.current) : { ratings: {}, reviews: {}, helpful: {} });
    mineRef.current = next;
    const p = commChain.current.then(() => r.db.doc("community/" + r.uid).set(next));
    commChain.current = p.catch(() => {});
    return p.then(() => { if (okMsg) toast(okMsg); return true; }).catch((err) => {
      if (err && err.code === "invalid_argument") { setCommReadOnly(true); toast("Your access to this page is view-only, so that wasn't saved."); }
      else if (err && err.code === "quota_exceeded") toast("That wasn't saved: this page's shared storage is full.");
      else toast("That didn't save. Check your connection and try again.");
      return false;
    });
  }, [toast]);

  const ratings = rt.mode === "cloud" && !commReadOnly ? agg.mine?.ratings || {} : shelf.ratings;

  const api = useMemo(() => ({
    route, go, back, theme, setTheme: setThemeState, rt, ex, setEx, toast, agg, ratings, commWritable, shelfLocalOnly,
    shelf,
    mineHelpful: agg.mine?.helpful || {},
    setStatus(id, status) {
      const s = BY_ID.get(id);
      updateShelf((p) => {
        const e = p.entries[id] || { ch: 0, fav: false };
        const ch = status === "COMPLETED" && s.ch ? s.ch : e.ch;
        return { ...p, entries: { ...p.entries, [id]: { ...e, status, ch, at: Date.now() } } };
      });
      toast(`${s.title}: ${SHELF_LABEL[status]}`);
    },
    setProgress(id, n) {
      const s = BY_ID.get(id);
      const ch = Math.max(0, Math.min(Number(n) || 0, s.ch ?? 100000));
      updateShelf((p) => {
        const e = p.entries[id] || { status: "READING", fav: false };
        const status = s.ch && ch >= s.ch && s.status !== "ONGOING" ? "COMPLETED" : e.status === "PLAN_TO_READ" && ch > 0 ? "READING" : e.status;
        return { ...p, entries: { ...p.entries, [id]: { ...e, status, ch, at: Date.now() } } };
      });
    },
    toggleFav(id) {
      const s = BY_ID.get(id);
      const on = !shelf.entries[id]?.fav;
      updateShelf((p) => {
        const e = p.entries[id] || { status: "PLAN_TO_READ", ch: 0, fav: false };
        return { ...p, entries: { ...p.entries, [id]: { ...e, fav: on, at: Date.now() } } };
      });
      toast(on ? `Added ${s.title} to favorites` : `Removed ${s.title} from favorites`);
    },
    removeEntry(id) {
      updateShelf((p) => { const entries = { ...p.entries }; delete entries[id]; return { ...p, entries }; });
      toast(`Removed ${BY_ID.get(id).title} from your shelf`);
    },
    visit(id) {
      updateShelf((p) => ({ ...p, history: [{ id, at: Date.now() }, ...p.history.filter((h) => h.id !== id)].slice(0, 40) }));
    },
    clearHistory() { updateShelf((p) => ({ ...p, history: [] })); toast("Viewing history cleared"); },
    rate(id, n) {
      if (rtRef.current.mode === "cloud" && !commReadOnly) {
        writeMine((m) => { if (n == null) delete m.ratings[id]; else m.ratings[id] = n; return m; }, n == null ? "Rating cleared" : `Rated ${n}/10`);
      } else {
        updateShelf((p) => { const ratings = { ...p.ratings }; if (n == null) delete ratings[id]; else ratings[id] = n; return { ...p, ratings }; });
        toast(n == null ? "Rating cleared" : `Rated ${n}/10 (saved in this browser)`);
      }
    },
    saveReview(id, review) {
      return writeMine((m) => {
        const prev = m.reviews[id];
        m.reviews[id] = { ...review, at: prev ? prev.at : Date.now(), edited: !!prev };
        return m;
      }, "Review published");
    },
    deleteReview(id) { return writeMine((m) => { delete m.reviews[id]; return m; }, "Review deleted"); },
    toggleHelpful(authorUid, id) {
      const key = authorUid + "|" + id;
      return writeMine((m) => { if (m.helpful[key]) delete m.helpful[key]; else m.helpful[key] = true; return m; });
    },
    /** The artifact owner can take down someone else's review (moderation). */
    removeReview(authorUid, id) {
      const r = rtRef.current;
      const theirs = comm.find((d) => d.uid === authorUid);
      if (!theirs) return Promise.resolve(false);
      const next = plain(theirs);
      delete next.reviews[id];
      return r.db.doc("community/" + authorUid).set(next).then(() => { toast("Review removed"); return true; }).catch(() => { toast("Couldn't remove that review."); return false; });
    },
  }), [route, go, back, theme, rt, ex, toast, agg, ratings, commWritable, shelfLocalOnly, shelf, updateShelf, writeMine, comm, commReadOnly]);

  let page;
  if (route.page === "series") page = html`<${SeriesPage} key=${route.id} id=${route.id} />`;
  else if (route.page === "explore") page = html`<${Explore} />`;
  else if (route.page === "rankings") page = html`<${Rankings} />`;
  else if (route.page === "seasonal") page = html`<${Seasonal} />`;
  else if (route.page === "shelf") page = html`<${Shelf} />`;
  else page = html`<${Home} />`;

  return html`<${AppCtx.Provider} value=${api}>
    <${Header} />
    ${page}
    <${Footer} />
    <div className="toasts" role="status" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} className="toast">${t.msg}</div>`)}</div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>
