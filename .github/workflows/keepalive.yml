# GitHub pauses scheduled workflows after 60 days without repository activity.
# This re-enables the scheduler once a month so automatic updates never stop.
name: Keep schedules alive

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow enable jobs.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
